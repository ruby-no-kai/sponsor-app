syntax = "proto3";

package protobufable;

// What an enum value publishes when it is rendered as an RFC 9457 problem document.
//
// Carried by a custom option on the value, which an application declares itself:
//
//     import "google/protobuf/descriptor.proto";
//     import "protobufable/problem.proto";
//
//     extend google.protobuf.EnumValueOptions {
//       optional protobufable.ProblemTypeOptions problem_type = 50001;
//     }
//
//     enum ProblemType {
//       PROBLEM_TYPE_UNSPECIFIED = 0;
//       PROBLEM_TYPE_NOT_FOUND = 1 [(problem_type) = {uri: "not-found", http_status: 404}];
//     }
//
// The extension is declared by the application rather than here because its field number is a
// global namespace: numbers are registered in protocolbuffers/protobuf docs/options.md, and
// protobufable does not hold one yet. This message needs none, so it ships now, and an
// application picks its own number from the internal-use range meanwhile.
//
// One message rather than one option per property: the extension then spends one number where
// separate scalars would spend one each, and a property added later is a field here.
message ProblemTypeOptions {
  // Identifier this problem type publishes, resolved against the deployment's type prefix to
  // form the document's `type`. Several values may deliberately publish the same one.
  string uri = 1;

  // HTTP status this problem type is returned with. A property of the problem type rather than
  // of the code path that raised it: two errors needing different statuses are different types.
  uint32 http_status = 2;
}
