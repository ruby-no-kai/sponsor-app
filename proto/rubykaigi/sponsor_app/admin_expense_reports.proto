syntax = "proto3";

package rubykaigi.sponsor_app;

import "buf/validate/validate.proto";
import "rubykaigi/sponsor_app/expense_report.proto";

option ruby_package = "Rk::SponsorApp";

// The verdict on an expense report's latest submission, taken by
// AdminService.CreateExpenseReportReview.
message ExpenseReportReviewInput {
  // The verdict.
  ExpenseReportReview.Action action = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // What to tell the sponsor. A rejection without one is answered `invalid_argument` with
  // PROBLEM_TYPE_INVALID_RECORD.
  optional string comment = 2;
}
