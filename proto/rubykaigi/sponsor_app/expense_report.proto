syntax = "proto3";

package rubykaigi.sponsor_app;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option ruby_package = "Rk::SponsorApp";

// The expenses a sponsor spent on a custom package, which the organizers offset against the
// sponsorship fee once they approve them. A sponsorship has at most one.
//
// Amounts, rates and totals are decimal strings, such as "120000.0", as a double would round them.
message ExpenseReport {
  // Where the report stands.
  enum Status {
    // The zero value proto3 requires. Never returned.
    STATUS_UNSPECIFIED = 0;

    // Being written by the sponsor.
    STATUS_DRAFT = 1;

    // Submitted and awaiting review.
    STATUS_SUBMITTED = 2;

    // Approved by the organizers. An approved report takes no further changes.
    STATUS_APPROVED = 3;

    // Returned to the sponsor for changes, with the review saying why.
    STATUS_REJECTED = 4;
  }

  // Expense report ID.
  int64 id = 1 [jstype = JS_STRING];

  // Where the report stands.
  Status status = 2;

  // Sum of the line items' amounts before tax.
  string total_amount = 3;

  // Sum of the line items' tax.
  string total_tax_amount = 4;

  // How many times the report has been submitted. 0 until the first submission.
  int32 revision = 5;

  // Every line item, in the order the sponsor arranged them.
  repeated ExpenseLineItem line_items = 6;

  // Every file uploaded for the sponsorship's expenses, whether a line item attaches it or not.
  // A file still being uploaded is left out.
  repeated ExpenseFile files = 7;

  // The organizers' verdict on the latest submission. Absent until they review it.
  optional ExpenseReportReview latest_review = 8;

  // When the sponsor started the report.
  google.protobuf.Timestamp created_at = 9;

  // When the report or its totals last changed.
  google.protobuf.Timestamp updated_at = 10;
}

// One expense of a report, such as a venue rental.
message ExpenseLineItem {
  // Line item ID.
  int64 id = 1 [jstype = JS_STRING];

  // What the expense was for.
  string title = 2;

  // Anything the sponsor adds about the expense. Absent when there is nothing.
  optional string notes = 3;

  // Amount before tax.
  string amount = 4;

  // Tax rate the tax was calculated at, such as "0.1". Absent when the tax amount was entered by
  // hand.
  optional string tax_rate = 5;

  // Tax on the amount.
  string tax_amount = 6;

  // Whether the amount is a planned budget rather than a final figure.
  bool preliminal = 7;

  // Sort key among the report's line items, lowest first. Positions may skip numbers.
  int32 position = 8;

  // IDs of the ExpenseFile receipts and invoices attached, in the order they were attached.
  repeated int64 file_ids = 9 [jstype = JS_STRING];
}

// A receipt or invoice uploaded for a sponsorship's expenses.
message ExpenseFile {
  // Expense file ID.
  int64 id = 1 [jstype = JS_STRING];

  // Name of the file as uploaded. Absent when the uploader gave none.
  optional string filename = 2;

  // MIME type the storage recorded for the upload, such as "application/pdf".
  string content_type = 3;

  // When the upload began.
  google.protobuf.Timestamp created_at = 4;
}

// The organizers' verdict on a submission of an expense report.
message ExpenseReportReview {
  // The verdict.
  enum Action {
    // The zero value proto3 requires. Never returned.
    ACTION_UNSPECIFIED = 0;

    // The expenses are accepted as reported.
    ACTION_APPROVE = 1;

    // The report goes back to the sponsor for changes.
    ACTION_REJECT = 2;
  }

  // The verdict.
  Action action = 1;

  // What the organizers told the sponsor. Always present on a rejection.
  optional string comment = 2;

  // When the organizers gave the verdict.
  google.protobuf.Timestamp created_at = 3;
}

// The figures an expense report is weighed against, which its editor shows beside it.
message ExpenseReportCalculation {
  // The tax rates a line item may be calculated at, such as "0.1", "0.08" and "0.0". The first is
  // the one an editor offers first.
  repeated string tax_rates = 1;

  // Digits after the decimal point that amounts are given in. Calculated tax is rounded down to
  // them.
  int32 decimal = 2;

  // Fee of the sponsorship's plan. Absent while the plan is undetermined.
  optional string plan_price = 3;

  // Fee the plan adds when a booth is assigned. Absent while the plan is undetermined.
  optional string plan_price_booth = 4;

  // Whether the sponsorship is assigned a booth.
  bool booth_assigned = 5;

  // The fee the expenses are offset against: plan_price, plus plan_price_booth when a booth is
  // assigned. "0" while the plan is undetermined.
  string total_fee = 6;
}

// The writable fields of a line item, taken by AdminService.CreateExpenseLineItem and
// UpdateExpenseLineItem. An update replaces every field but position.
//
// Amounts are non-negative decimals with at most ten digits before the point and two after it,
// such as "12000" or "12000.50".
message ExpenseLineItemInput {
  // What the expense was for.
  string title = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "expense_line_item_input.title.not_blank"
      message: "value must not be blank"
      expression: "this.trim() != ''"
    }
  ];

  // Anything the sponsor adds about the expense. Absent stores none.
  optional string notes = 2;

  // Amount before tax.
  string amount = 3 [(buf.validate.field).cel = {
    id: "expense_line_item_input.amount.format"
    message: "must be an amount such as 1000 or 1000.50"
    expression: "this.matches('^[0-9]{1,10}([.][0-9]{1,2})?$')"
  }];

  // Tax rate to calculate the tax at, one of ExpenseReportCalculation.tax_rates, such as "0.1".
  // Absent takes tax_amount as entered. A rate that is not offered is answered `invalid_argument`
  // with PROBLEM_TYPE_INVALID_RECORD.
  optional string tax_rate = 4 [(buf.validate.field).cel = {
    id: "expense_line_item_input.tax_rate.format"
    message: "must be a rate such as 0.1 or 0.08"
    expression: "this.matches('^[0-9]([.][0-9]{1,4})?$')"
  }];

  // Tax on the amount. With tax_rate it is recalculated from amount, rounded down to
  // ExpenseReportCalculation.decimal digits, but must still be a decimal, such as "0".
  string tax_amount = 5 [(buf.validate.field).cel = {
    id: "expense_line_item_input.tax_amount.format"
    message: "must be an amount such as 1000 or 1000.50"
    expression: "this.matches('^[0-9]{1,10}([.][0-9]{1,2})?$')"
  }];

  // Whether the amount is a planned budget rather than a final figure.
  bool preliminal = 6;

  // Place to put the line item at among the report's line items, 1 being the first. The others
  // keep their order around it. Absent keeps a line item where it is, and adds a new one last.
  optional int32 position = 7 [(buf.validate.field).int32.gt = 0];

  // IDs of the sponsorship's ExpenseFile receipts and invoices to attach, replacing those
  // attached. A file of another sponsorship is answered `not_found`.
  repeated int64 file_ids = 8 [
    jstype = JS_STRING,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.int64.gt = 0
  ];
}

// A receipt or invoice to upload, taken by AdminService.CreateExpenseFileUpload.
message ExpenseFileUploadInput {
  // Name of the file, as the uploader's computer calls it.
  string filename = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255
  ];

  // MIME type of the file: a JPEG, PNG, GIF or WebP image, or a PDF.
  string content_type = 2 [(buf.validate.field).string = {
    in: [
      "image/jpeg",
      "image/png",
      "image/gif",
      "image/webp",
      "application/pdf"
    ]
  }];
}

// An upload of an expense file in progress: a presigned POST to the storage, valid for 15
// minutes.
//
// POST a multipart form to `url` holding every entry of `fields`, then `x-amz-checksum-algorithm`
// set to "SHA256" and `x-amz-checksum-sha256` to the base64 SHA-256 digest of the file, then the
// file itself as `file`. The storage refuses a file larger than `max_size` or of another content
// type than the one declared. Report the upload as complete afterwards.
message ExpenseFileUpload {
  // ID of the ExpenseFile being uploaded.
  int64 file_id = 1 [jstype = JS_STRING];

  // Where to POST the form.
  string url = 2;

  // Form fields to send ahead of the file, as given.
  map<string, string> fields = 3;

  // Largest file the storage accepts, in bytes.
  int64 max_size = 4;
}
