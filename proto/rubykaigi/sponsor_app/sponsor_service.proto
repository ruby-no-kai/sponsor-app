syntax = "proto3";

package rubykaigi.sponsor_app;

import "rubykaigi/sponsor_app/sponsor_applications.proto";
import "rubykaigi/sponsor_app/sponsor_broadcasts.proto";
import "rubykaigi/sponsor_app/sponsor_events.proto";
import "rubykaigi/sponsor_app/sponsor_exhibitions.proto";
import "rubykaigi/sponsor_app/sponsor_passes.proto";
import "rubykaigi/sponsor_app/sponsor_shell.proto";
import "rubykaigi/sponsor_app/sponsor_viewer.proto";

option ruby_package = "Rk::SponsorApp";

// The sponsor area: applying for a sponsorship and managing it afterwards.
//
// Served over the Connect protocol: by POST, which must send `Connect-Protocol-Version: 1`, and
// by GET for an RPC without side effects. A browser may call it only from this site's own origin.
//
// A sponsor contact signs in through a link emailed to their address. An RPC that acts on a
// sponsorship takes the conference's slug, and answers `unauthenticated` without a sponsor session
// or `not_found` when the signed-in contact has no sponsorship in that conference.
//
// A problem the server raises carries a packed protobufable.ProblemDetails whose `type` is listed
// in ProblemType. A request breaking a field's rules is answered `invalid_argument` with a
// google.rpc.BadRequest naming each field. A rejected or malformed call and an unexpected failure
// carry no ProblemDetails, only the Connect code. Each of these errors carries a
// google.rpc.RequestInfo holding the ID to quote when reporting it. A call the transport refuses
// outright, such as a GET of an RPC with side effects (405), an unsupported Content-Type (415) or
// an unknown RPC (404), is answered with a plain-text body instead.
service SponsorService {
  // Shell

  // Returns the texts the sponsor area shows, in the locale chosen for this browser. Answers
  // without a session too.
  rpc GetTranslations(SponsorServiceGetTranslationsRequest) returns (SponsorServiceGetTranslationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Chooses the locale the sponsor area is shown in, and remembers it for this browser in a
  // cookie. Answers without a session too.
  rpc SetLocale(SponsorServiceSetLocaleRequest) returns (SponsorServiceSetLocaleResponse);

  // Lists the conferences taking sponsorship applications now. A hidden conference, which takes
  // applications by invitation only, is left out. Answers without a session too.
  rpc ListOpenConferences(SponsorServiceListOpenConferencesRequest) returns (SponsorServiceListOpenConferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns the signed-in contact's sponsorship of a conference, with what its dashboard shows:
  // the booth, events, expense report and tickets as they stand, and the announcements to
  // sponsors.
  rpc GetSponsorship(SponsorServiceGetSponsorshipRequest) returns (SponsorServiceGetSponsorshipResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Applications

  // Returns a conference's application form, with what a new application starts from. Answers
  // without a session too. A hidden conference answers `not_found`, as an unknown one does, unless
  // the request carries its invitation code or the signed-in contact sponsors it already. Answers
  // `failed_precondition` while the organizers have not described the form, unless it has only its
  // conference.
  rpc GetApplicationForm(SponsorServiceGetApplicationFormRequest) returns (SponsorServiceGetApplicationFormResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Applies for a sponsorship of a conference, and signs this browser in as its contact. Answers
  // without a session too, and a hidden conference takes its invitation code as
  // GetApplicationForm does. Answers `failed_precondition` when the signed-in contact has applied
  // already, the conference takes no applications (unless this browser is signed in to the staff
  // area too) or its form is not described, and `aborted` when an application from the same
  // organization lands first.
  rpc CreateSponsorship(SponsorServiceCreateSponsorshipRequest) returns (SponsorServiceCreateSponsorshipResponse);

  // Returns the signed-in contact's application to a conference with its form, for editing.
  rpc GetSponsorshipApplication(SponsorServiceGetSponsorshipApplicationRequest) returns (SponsorServiceGetSponsorshipApplicationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Changes the signed-in contact's application to a conference. Answers `failed_precondition`
  // once the conference stops taking amendments, for organizers too.
  rpc UpdateSponsorship(SponsorServiceUpdateSponsorshipRequest) returns (SponsorServiceUpdateSponsorshipResponse);

  // Starts uploading a logo for a new application. Answers without a session too, keeping the file
  // for this browser until an application claims it. Answers `failed_precondition` when the
  // signed-in contact's sponsorship of the conference has a logo already, which
  // InitiateSponsorshipAssetUpdate replaces, or when the conference takes no amendments, unless
  // this browser is signed in to the staff area too.
  rpc CreateSponsorshipAssetUpload(SponsorServiceCreateSponsorshipAssetUploadRequest) returns (SponsorServiceCreateSponsorshipAssetUploadResponse);

  // Starts uploading a logo file again, replacing what it holds once the upload completes. Answers
  // `failed_precondition` when the conference takes no amendments, unless this browser is signed
  // in to the staff area too.
  rpc InitiateSponsorshipAssetUpdate(SponsorServiceInitiateSponsorshipAssetUpdateRequest) returns (SponsorServiceInitiateSponsorshipAssetUpdateResponse);

  // Records an upload as complete, once the storage holds the file. Answers `failed_precondition`
  // while the storage holds none.
  rpc CompleteSponsorshipAssetUpload(SponsorServiceCompleteSponsorshipAssetUploadRequest) returns (SponsorServiceCompleteSponsorshipAssetUploadResponse);

  // Exhibitions and events

  // Submits what the sponsor will exhibit at its booth. Answers `failed_precondition` until a booth
  // is assigned, and `aborted` when the sponsorship has booth details already, which
  // UpdateExhibition changes. The booth details are on GetSponsorship.
  rpc CreateExhibition(SponsorServiceCreateExhibitionRequest) returns (SponsorServiceCreateExhibitionResponse);

  // Changes the booth details. Answers `not_found` before any are submitted and
  // `failed_precondition` until a booth is assigned.
  rpc UpdateExhibition(SponsorServiceUpdateExhibitionRequest) returns (SponsorServiceUpdateExhibitionResponse);

  // Every RPC on events answers `failed_precondition` until the sponsorship is accepted. Those that
  // change an event or its image answer `failed_precondition` too while the conference takes no
  // event submissions. An event of another sponsorship is `not_found`.

  // Returns whether the conference takes event submissions, and the texts the event form shows.
  rpc GetSponsorEventForm(SponsorServiceGetSponsorEventFormRequest) returns (SponsorServiceGetSponsorEventFormResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns an event of the signed-in contact's sponsorship.
  rpc GetSponsorEvent(SponsorServiceGetSponsorEventRequest) returns (SponsorServiceGetSponsorEventResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Submits an event for the organizers' review.
  rpc CreateSponsorEvent(SponsorServiceCreateSponsorEventRequest) returns (SponsorServiceCreateSponsorEventResponse);

  // Changes an event. Answers `failed_precondition` for a withdrawn event.
  rpc UpdateSponsorEvent(SponsorServiceUpdateSponsorEventRequest) returns (SponsorServiceUpdateSponsorEventResponse);

  // Withdraws an event, which the sponsor cannot undo. Answers `failed_precondition` for an event
  // withdrawn already.
  rpc WithdrawSponsorEvent(SponsorServiceWithdrawSponsorEventRequest) returns (SponsorServiceWithdrawSponsorEventResponse);

  // Starts uploading an image for an event, which the event claims once saved with its ID.
  rpc CreateSponsorEventAssetUpload(SponsorServiceCreateSponsorEventAssetUploadRequest) returns (SponsorServiceCreateSponsorEventAssetUploadResponse);

  // Starts uploading an image file again, replacing what it holds once the upload completes.
  rpc InitiateSponsorEventAssetUpdate(SponsorServiceInitiateSponsorEventAssetUpdateRequest) returns (SponsorServiceInitiateSponsorEventAssetUpdateResponse);

  // Records an upload as complete, once the storage holds the image. Answers `failed_precondition`
  // while the storage holds none.
  rpc CompleteSponsorEventAssetUpload(SponsorServiceCompleteSponsorEventAssetUploadRequest) returns (SponsorServiceCompleteSponsorEventAssetUploadResponse);

  // Broadcasts and passes

  // Lists the emails the organizers sent to the signed-in contact's sponsorship, with the sign-in
  // link each carried pointing at the sponsorship's dashboard.
  rpc ListBroadcastDeliveries(SponsorServiceListBroadcastDeliveriesRequest) returns (SponsorServiceListBroadcastDeliveriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the registrations made on the ticketing service through the sponsorship's discount
  // codes, asking the ticketing service on every call. Answers `failed_precondition` until the
  // conference distributes tickets through the ticketing service and the sponsorship is set up
  // there, and `internal` when the registrations span more than one page there.
  rpc ListPassRedemptions(SponsorServiceListPassRedemptionsRequest) returns (SponsorServiceListPassRedemptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns the sponsor's request to void a registration, or, before one is made, the registration
  // as the ticketing service has it now. Answers `not_found` for a registration not made through
  // the sponsorship's discount codes, and `failed_precondition` while the conference distributes
  // no tickets through the ticketing service.
  rpc GetPassRetraction(SponsorServiceGetPassRetractionRequest) returns (SponsorServiceGetPassRetractionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Voids a registration made through the sponsorship's discount codes, with all of its tickets,
  // and gives the tickets back to the codes. Nobody holding the tickets is notified. Answers
  // `failed_precondition` once the conference stops letting sponsors void registrations,
  // `not_found` as GetPassRetraction does, and `invalid_argument` for a registration that does not
  // qualify (PassRegistration.retractable). When the ticketing service fails, the request is kept
  // and calling again retries it. Calling again once it is voided answers it unchanged.
  rpc CreatePassRetraction(SponsorServiceCreatePassRetractionRequest) returns (SponsorServiceCreatePassRetractionResponse);

  // Expense reports

  // Viewer

  // Returns who is using the sponsor area. Answers without a session too, describing a visitor
  // who is not signed in.
  rpc GetViewer(SponsorServiceGetViewerRequest) returns (SponsorServiceGetViewerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Signs the sponsor contact out of this browser. A staff session in the same browser stays
  // signed in. Answers without a session too.
  rpc SignOut(SponsorServiceSignOutRequest) returns (SponsorServiceSignOutResponse);
}
