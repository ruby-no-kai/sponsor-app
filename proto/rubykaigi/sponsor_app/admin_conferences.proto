syntax = "proto3";

package rubykaigi.sponsor_app;

import "buf/validate/validate.proto";
import "rubykaigi/sponsor_app/admin_conference.proto";
import "rubykaigi/sponsor_app/plan_summary.proto";
import "rubykaigi/sponsor_app/sponsorship_summary.proto";

option ruby_package = "Rk::SponsorApp";

// Request for AdminService.ListConferences.
message AdminServiceListConferencesRequest {}

// Response for AdminService.ListConferences.
message AdminServiceListConferencesResponse {
  // Every conference the signed-in staff member can manage, hidden ones included, most recently
  // created first. Not paginated, as there is one conference a year. Each carries its staff-only
  // settings, such as whether it is hidden.
  repeated AdminConference conferences = 1;
}

// Request for AdminService.GetConference.
message AdminServiceGetConferenceRequest {
  // Slug of the conference, such as "rubykaigi2048".
  string conference_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  }];
}

// Response for AdminService.GetConference: the conference with an overview of its plans and
// sponsorships.
message AdminServiceGetConferenceResponse {
  // The conference the request names.
  AdminConference conference = 1;

  // Locales the application form is described in, such as "en" and "ja", in the order they were
  // added.
  repeated string form_description_locales = 2;

  // The conference's plans, lowest rank first.
  repeated PlanSummary plans = 3;

  // Every sponsorship of the conference, withdrawn ones included, oldest application first.
  repeated SponsorshipSummary sponsorships = 4;
}
