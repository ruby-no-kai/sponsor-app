syntax = "proto3";

package rubykaigi.sponsor_app;

import "buf/validate/validate.proto";
import "rubykaigi/sponsor_app/conference.proto";
import "rubykaigi/sponsor_app/sponsorship_summary.proto";

option ruby_package = "Rk::SponsorApp";

// A sponsoring company with every setting organizers manage. One organization can sponsor many
// conferences, and an applicant joins the organization their contact email's domain names.
//
// Staff-only. SponsorService never returns it.
message AdminOrganization {
  // Email domain that identifies the organization, such as "example.com". Unique across
  // organizations, and the key requests name the organization by.
  string domain = 1;

  // Display name.
  string name = 2;

  // Whether applications of the organization wait for the organizers' acceptance even on a plan
  // that accepts applications as soon as they are submitted.
  bool auto_acceptance_disabled = 3;

  // Code an application form URL carries to file the application under this organization,
  // whatever the applicant's email domain. Generated by the server.
  string affiliation_code = 4;

  // Sponsorships of the organization across every conference, withdrawn ones included.
  int32 sponsorship_count = 5;
}

// A conference taking applications, with the URL of its application form that files an
// application under the organization.
message OrganizationAffiliationUrl {
  // The conference.
  Conference conference = 1;

  // Absolute URL of the conference's application form carrying the organization's
  // affiliation_code. Built from the host the server sends email links with.
  string url = 2;
}

// A sponsorship of an organization, as the organization's history lists it.
message OrganizationSponsorship {
  // The sponsorship in brief. Its organization is the one whose history lists it.
  SponsorshipSummary sponsorship = 1;

  // The conference sponsored.
  Conference conference = 2;

  // Name of the plan sponsored. Absent while the plan is undetermined.
  optional string plan_name = 3;

  // Whether the sponsor asked for a booth. SponsorshipSummary.booth_assigned tells whether one is
  // assigned.
  bool booth_requested = 4;
}

// The writable fields of an organization, taken by AdminService.CreateOrganization and
// UpdateOrganization.
//
// The server generates the affiliation code.
message OrganizationInput {
  // Display name.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).cel = {
      id: "organization_input.name.not_blank"
      message: "value must not be blank"
      expression: "this.trim() != ''"
    }
  ];

  // Email domain that identifies the organization, in lowercase, such as "example.com". Another
  // organization's domain is answered with PROBLEM_TYPE_INVALID_RECORD.
  string domain = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "organization_input.domain.hostname"
      message: "must be a domain name in lowercase, such as example.com"
      expression: "this.isHostname() && !this.endsWith('.') && !this.matches('[A-Z]')"
    }
  ];

  // Whether applications of the organization wait for the organizers' acceptance even on a plan
  // that accepts applications as soon as they are submitted.
  bool auto_acceptance_disabled = 3;
}

// Request for AdminService.ListOrganizations.
message AdminServiceListOrganizationsRequest {}

// Response for AdminService.ListOrganizations.
message AdminServiceListOrganizationsResponse {
  // Every organization, by name. Not paginated, as the staff page lists them all at once.
  repeated AdminOrganization organizations = 1;
}

// Request for AdminService.GetOrganization.
message AdminServiceGetOrganizationRequest {
  // Domain of the organization, such as "example.com".
  string domain = 1 [(buf.validate.field).string.min_len = 1];
}

// Response for AdminService.GetOrganization: the organization, the application form URLs to
// hand to it, and its sponsorships.
message AdminServiceGetOrganizationResponse {
  // The organization the request names.
  AdminOrganization organization = 1;

  // An affiliation URL per conference taking applications, most recently created conference
  // first. Empty when no conference takes applications.
  repeated OrganizationAffiliationUrl affiliation_urls = 2;

  // Every sponsorship of the organization, withdrawn ones included, latest application first.
  repeated OrganizationSponsorship sponsorships = 3;
}

// Request for AdminService.CreateOrganization.
message AdminServiceCreateOrganizationRequest {
  // The organization to create.
  OrganizationInput input = 1 [(buf.validate.field).required = true];
}

// Response for AdminService.CreateOrganization.
message AdminServiceCreateOrganizationResponse {
  // The organization created.
  AdminOrganization organization = 1;
}

// Request for AdminService.UpdateOrganization.
message AdminServiceUpdateOrganizationRequest {
  // Domain the organization has now, such as "example.com".
  string domain = 1 [(buf.validate.field).string.min_len = 1];

  // Every writable field, replacing what is stored. A new domain renames the organization's key.
  OrganizationInput input = 2 [(buf.validate.field).required = true];
}

// Response for AdminService.UpdateOrganization.
message AdminServiceUpdateOrganizationResponse {
  // The organization as updated.
  AdminOrganization organization = 1;
}
