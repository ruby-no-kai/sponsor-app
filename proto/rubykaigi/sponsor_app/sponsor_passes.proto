syntax = "proto3";

package rubykaigi.sponsor_app;

import "buf/validate/validate.proto";
import "rubykaigi/sponsor_app/conference.proto";
import "rubykaigi/sponsor_app/tito_discount_code.proto";

option ruby_package = "Rk::SponsorApp";

// A discount code as the ticketing service applies it, through which a sponsor's people claim
// their tickets.
message PassDiscountCode {
  // Which tickets the code is for.
  TitoDiscountCode.Kind kind = 1;

  // URL where the sponsor's people register with the code. Anyone holding it can claim the
  // tickets, so the sponsor shares it with care.
  string url = 2;

  // Tickets the ticketing service admits through the code, as last set there. It can lag behind
  // the tickets the sponsorship includes until the organizers update the code. Absent for
  // KIND_BOOTH_PAID, whose passes are bought one by one.
  optional int32 quantity = 3;
}

// A ticket a sponsor's people claimed through one of the sponsorship's discount codes.
message PassTicket {
  // Reference the ticketing service shows for the ticket, such as "ABCD-1".
  string reference = 1;

  // Slug of the ticket's release on the ticketing service, such as "sponsor", "exhibitor" or
  // "exhibitor-paid". Absent for a release the organizers have not set up here.
  optional string release_slug = 2;

  // Email address of the person the ticket is assigned to. Absent while it is unassigned.
  optional string email = 3;

  // State on the ticketing service, such as "complete", "incomplete" or "unassigned". An
  // incomplete ticket has questions left to answer before it shows a check-in code.
  string state = 4;

  // Whether the ticket has been voided.
  bool void = 5;
}

// A registration on the ticketing service, made through one of the sponsorship's discount codes:
// one purchase, holding one or more tickets.
message PassRegistration {
  // Identifier of the registration on the ticketing service, in decimal digits, which
  // GetPassRetraction and CreatePassRetraction take.
  string id = 1;

  // Reference the ticketing service shows for the registration, such as "ABCD".
  string reference = 2;

  // Email address of the person who registered. Absent when the ticketing service holds none.
  optional string email = 3;

  // Whether the sponsor can void the registration with CreatePassRetraction, provided the
  // conference still allows it. Only a free, uncancelled registration whose tickets are all of one
  // release and all claimed with the same one of the sponsorship's codes qualifies.
  bool retractable = 4;

  // Tickets claimed with the sponsorship's discount codes. Tickets the registration holds through
  // other codes are left out.
  repeated PassTicket tickets = 5;
}

// The sponsor's request to void a registration and its tickets, which gives the tickets back to
// the sponsorship's discount codes. Before one is requested, the registration it would void.
message PassRetraction {
  // How far the request has come.
  enum State {
    // The zero value proto3 requires. Never returned.
    STATE_UNSPECIFIED = 0;

    // Nothing has been requested for the registration yet.
    STATE_NOT_REQUESTED = 1;

    // Requested, and the ticketing service has not voided the registration yet.
    STATE_PENDING = 2;

    // The registration and its tickets are voided.
    STATE_COMPLETED = 3;
  }

  // A ticket the request voids.
  message Ticket {
    // Reference the ticketing service shows for the ticket, such as "ABCD-1".
    string reference = 1;

    // Slug of the ticket's release on the ticketing service, such as "sponsor". Absent for a
    // release the organizers have not set up here.
    optional string release_slug = 2;

    // Email address of the person the ticket is assigned to. Absent while it is unassigned.
    optional string email = 3;
  }

  // Identifier of the registration on the ticketing service, in decimal digits.
  string tito_registration_id = 1;

  // How far the request has come.
  State state = 2;

  // Reference the ticketing service shows for the registration, such as "ABCD".
  string reference = 3;

  // Email address of the person who registered. Absent when the ticketing service holds none.
  optional string email = 4;

  // Every ticket of the registration, all of which are voided together. Once requested, these are
  // the tickets as they stood when the request was made.
  repeated Ticket tickets = 5;

  // Whether the registration qualifies for voiding, as PassRegistration.retractable describes.
  bool retractable = 6;

  // Why the sponsor asked to void the registration. Absent while state is STATE_NOT_REQUESTED.
  optional string reason = 7;
}

// The writable fields of a PassRetraction.
message PassRetractionInput {
  // Why the sponsor asks to void the registration. Required, and more than spaces.
  string reason = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1000,
    (buf.validate.field).cel = {
      id: "pass_retraction_input.reason.not_blank"
      message: "value must not be blank"
      expression: "this.trim() != ''"
    }
  ];

  // Whether the sponsor confirms having read what voiding does: every ticket of the registration
  // is voided, and nobody is notified. Must be true.
  bool confirmed = 2 [(buf.validate.field).bool.const = true];
}

// Request for SponsorService.ListPassRedemptions.
message SponsorServiceListPassRedemptionsRequest {
  // Slug of the conference, such as "rubykaigi2048".
  string conference_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  }];
}

// Response for SponsorService.ListPassRedemptions.
message SponsorServiceListPassRedemptionsResponse {
  // The conference sponsored, whose contact address takes requests to void a registration by hand.
  Conference conference = 1;

  // Codes to claim the tickets with, one per kind created so far: conference tickets, then booth
  // passes, then paid booth passes.
  repeated PassDiscountCode discount_codes = 2;

  // Registrations made through the codes, as the ticketing service lists them.
  repeated PassRegistration registrations = 3;

  // Whether the conference still lets sponsors void a registration themselves.
  bool retraction_enabled = 4;
}

// Request for SponsorService.GetPassRetraction.
message SponsorServiceGetPassRetractionRequest {
  // Slug of the conference, such as "rubykaigi2048".
  string conference_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  }];

  // Identifier of the registration on the ticketing service, as PassRegistration.id gives it.
  string tito_registration_id = 2 [(buf.validate.field).string = {pattern: "^[0-9]{1,20}$"}];
}

// Response for SponsorService.GetPassRetraction.
message SponsorServiceGetPassRetractionResponse {
  // The conference sponsored, whose contact address takes requests to void a registration by hand.
  Conference conference = 1;

  // The request to void the registration, or the registration before one is made.
  PassRetraction retraction = 2;

  // Whether the conference still lets sponsors void a registration themselves.
  bool retraction_enabled = 3;
}

// Request for SponsorService.CreatePassRetraction.
message SponsorServiceCreatePassRetractionRequest {
  // Slug of the conference, such as "rubykaigi2048".
  string conference_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[a-z0-9][a-z0-9_-]*$"
  }];

  // Identifier of the registration on the ticketing service, as PassRegistration.id gives it.
  string tito_registration_id = 2 [(buf.validate.field).string = {pattern: "^[0-9]{1,20}$"}];

  // Why the sponsor asks to void the registration, and its confirmation of what voiding does.
  PassRetractionInput input = 3 [(buf.validate.field).required = true];
}

// Response for SponsorService.CreatePassRetraction.
message SponsorServiceCreatePassRetractionResponse {
  // The request, voided on the ticketing service.
  PassRetraction retraction = 1;
}
