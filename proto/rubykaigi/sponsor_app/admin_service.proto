syntax = "proto3";

package rubykaigi.sponsor_app;

import "rubykaigi/sponsor_app/admin_conferences.proto";
import "rubykaigi/sponsor_app/admin_form_descriptions.proto";
import "rubykaigi/sponsor_app/admin_plans.proto";
import "rubykaigi/sponsor_app/admin_viewer.proto";

option ruby_package = "Rk::SponsorApp";

// The staff area: conferences, their sponsorships and everything organizers manage.
//
// Served over the Connect protocol: by POST, which must send `Connect-Protocol-Version: 1`, and
// by GET for an RPC without side effects. A browser may call it only from this site's own origin.
//
// Every RPC needs the staff session that the staff area's GitHub sign-in creates, and answers
// `unauthenticated` without one. A staff member restricted to some conferences is answered
// `permission_denied` for any other.
//
// A problem the server raises carries a packed protobufable.ProblemDetails whose `type` is listed
// in ProblemType. A request breaking a field's rules is answered `invalid_argument` with a
// google.rpc.BadRequest naming each field. A rejected or malformed call and an unexpected failure
// carry no ProblemDetails, only the Connect code. Each of these errors carries a
// google.rpc.RequestInfo holding the ID to quote when reporting it. A call the transport refuses
// outright, such as a GET of an RPC with side effects (405), an unsupported Content-Type (415) or
// an unknown RPC (404), is answered with a plain-text body instead.
service AdminService {
  // Conferences

  // Lists the conferences the signed-in staff member can manage.
  rpc ListConferences(AdminServiceListConferencesRequest) returns (AdminServiceListConferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one conference by its slug, with its plans and sponsorships.
  rpc GetConference(AdminServiceGetConferenceRequest) returns (AdminServiceGetConferenceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a conference. Restricted staff are answered `permission_denied`. A slug another
  // conference has is answered with PROBLEM_TYPE_INVALID_RECORD.
  rpc CreateConference(AdminServiceCreateConferenceRequest) returns (AdminServiceCreateConferenceResponse);

  // Replaces every writable field of a conference. Restricted staff are answered
  // `permission_denied`. A slug another conference has is answered with
  // PROBLEM_TYPE_INVALID_RECORD.
  rpc UpdateConference(AdminServiceUpdateConferenceRequest) returns (AdminServiceUpdateConferenceResponse);

  // Returns the conference tickets that each active sponsorship of a conference receives.
  rpc GetAttendeesKeeper(AdminServiceGetAttendeesKeeperRequest) returns (AdminServiceGetAttendeesKeeperResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists every sponsorship of a conference with its plan and the notes its application carries.
  rpc ListSponsorshipTableRows(AdminServiceListSponsorshipTableRowsRequest) returns (AdminServiceListSponsorshipTableRowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Form descriptions

  // Returns a conference's application form description in one locale.
  rpc GetFormDescription(AdminServiceGetFormDescriptionRequest) returns (AdminServiceGetFormDescriptionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Describes a conference's application form in a locale it is not described in yet. A locale
  // already described is answered `aborted` with PROBLEM_TYPE_CONFLICT.
  rpc CreateFormDescription(AdminServiceCreateFormDescriptionRequest) returns (AdminServiceCreateFormDescriptionResponse);

  // Replaces every writable field of a form description and renders its texts again. Moving it to
  // a locale already described is answered `aborted` with PROBLEM_TYPE_CONFLICT.
  rpc UpdateFormDescription(AdminServiceUpdateFormDescriptionRequest) returns (AdminServiceUpdateFormDescriptionResponse);

  // Plans

  // Lists a conference's plans, lowest rank first, with how much of each one's capacity is taken.
  rpc ListPlans(AdminServiceListPlansRequest) returns (AdminServiceListPlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one plan of a conference. A plan of another conference is answered `not_found`.
  rpc GetPlan(AdminServiceGetPlanRequest) returns (AdminServiceGetPlanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Adds a plan to a conference.
  rpc CreatePlan(AdminServiceCreatePlanRequest) returns (AdminServiceCreatePlanResponse);

  // Replaces every writable field of a plan. A plan of another conference is answered
  // `not_found`.
  rpc UpdatePlan(AdminServiceUpdatePlanRequest) returns (AdminServiceUpdatePlanResponse);

  // Sponsorships

  // Organizations

  // Booth assignments

  // Sponsor events

  // Announcements

  // Broadcasts

  // Expense reports

  // Viewer

  // Returns the signed-in staff member.
  rpc GetViewer(AdminServiceGetViewerRequest) returns (AdminServiceGetViewerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Ends the staff session. A sponsor session in the same browser stays signed in.
  rpc SignOut(AdminServiceSignOutRequest) returns (AdminServiceSignOutResponse);
}
