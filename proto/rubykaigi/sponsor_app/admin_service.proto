syntax = "proto3";

package rubykaigi.sponsor_app;

import "rubykaigi/sponsor_app/admin_booth_assignments.proto";
import "rubykaigi/sponsor_app/admin_conferences.proto";
import "rubykaigi/sponsor_app/admin_form_descriptions.proto";
import "rubykaigi/sponsor_app/admin_organizations.proto";
import "rubykaigi/sponsor_app/admin_plans.proto";
import "rubykaigi/sponsor_app/admin_sponsor_events.proto";
import "rubykaigi/sponsor_app/admin_sponsorships.proto";
import "rubykaigi/sponsor_app/admin_viewer.proto";

option ruby_package = "Rk::SponsorApp";

// The staff area: conferences, their sponsorships and everything organizers manage.
//
// Served over the Connect protocol: by POST, which must send `Connect-Protocol-Version: 1`, and
// by GET for an RPC without side effects. A browser may call it only from this site's own origin.
//
// Every RPC needs the staff session that the staff area's GitHub sign-in creates, and answers
// `unauthenticated` without one. A staff member restricted to some conferences is answered
// `permission_denied` for any other.
//
// A problem the server raises carries a packed protobufable.ProblemDetails whose `type` is listed
// in ProblemType. A request breaking a field's rules is answered `invalid_argument` with a
// google.rpc.BadRequest naming each field. A rejected or malformed call and an unexpected failure
// carry no ProblemDetails, only the Connect code. Each of these errors carries a
// google.rpc.RequestInfo holding the ID to quote when reporting it. A call the transport refuses
// outright, such as a GET of an RPC with side effects (405), an unsupported Content-Type (415) or
// an unknown RPC (404), is answered with a plain-text body instead.
service AdminService {
  // Conferences

  // Lists the conferences the signed-in staff member can manage.
  rpc ListConferences(AdminServiceListConferencesRequest) returns (AdminServiceListConferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one conference by its slug, with its plans and sponsorships.
  rpc GetConference(AdminServiceGetConferenceRequest) returns (AdminServiceGetConferenceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a conference. Restricted staff are answered `permission_denied`. A slug another
  // conference has is answered with PROBLEM_TYPE_INVALID_RECORD.
  rpc CreateConference(AdminServiceCreateConferenceRequest) returns (AdminServiceCreateConferenceResponse);

  // Replaces every writable field of a conference. Restricted staff are answered
  // `permission_denied`. A slug another conference has is answered with
  // PROBLEM_TYPE_INVALID_RECORD.
  rpc UpdateConference(AdminServiceUpdateConferenceRequest) returns (AdminServiceUpdateConferenceResponse);

  // Returns the conference tickets that each active sponsorship of a conference receives.
  rpc GetAttendeesKeeper(AdminServiceGetAttendeesKeeperRequest) returns (AdminServiceGetAttendeesKeeperResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists every sponsorship of a conference with its plan and the notes its application carries.
  rpc ListSponsorshipTableRows(AdminServiceListSponsorshipTableRowsRequest) returns (AdminServiceListSponsorshipTableRowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Form descriptions

  // Returns a conference's application form description in one locale.
  rpc GetFormDescription(AdminServiceGetFormDescriptionRequest) returns (AdminServiceGetFormDescriptionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Describes a conference's application form in a locale it is not described in yet. A locale
  // already described is answered `aborted` with PROBLEM_TYPE_CONFLICT.
  rpc CreateFormDescription(AdminServiceCreateFormDescriptionRequest) returns (AdminServiceCreateFormDescriptionResponse);

  // Replaces every writable field of a form description and renders its texts again. Moving it to
  // a locale already described is answered `aborted` with PROBLEM_TYPE_CONFLICT.
  rpc UpdateFormDescription(AdminServiceUpdateFormDescriptionRequest) returns (AdminServiceUpdateFormDescriptionResponse);

  // Plans

  // Lists a conference's plans, lowest rank first, with how much of each one's capacity is taken.
  rpc ListPlans(AdminServiceListPlansRequest) returns (AdminServiceListPlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one plan of a conference. A plan of another conference is answered `not_found`.
  rpc GetPlan(AdminServiceGetPlanRequest) returns (AdminServiceGetPlanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Adds a plan to a conference.
  rpc CreatePlan(AdminServiceCreatePlanRequest) returns (AdminServiceCreatePlanResponse);

  // Replaces every writable field of a plan. A plan of another conference is answered
  // `not_found`.
  rpc UpdatePlan(AdminServiceUpdatePlanRequest) returns (AdminServiceUpdatePlanResponse);

  // Sponsorships

  // Returns one sponsorship of a conference with what its staff page shows: the latest staff
  // notes, and the plans and fallback options an editor of it offers.
  rpc GetSponsorship(AdminServiceGetSponsorshipRequest) returns (AdminServiceGetSponsorshipResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Replaces every changeable field of a sponsorship, recording the signed-in staff member in its
  // editing history, then publishes the change: a chat notification, the sponsor list on the
  // conference website and the ticketing service's discount codes. The sponsor's own form rules,
  // such as plan availability and word limits, do not apply. A record failing validation is
  // answered `invalid_argument` with PROBLEM_TYPE_INVALID_RECORD.
  rpc UpdateSponsorship(AdminServiceUpdateSponsorshipRequest) returns (AdminServiceUpdateSponsorshipResponse);

  // Withdraws a sponsorship, releasing its plan and booth, and publishes the change as
  // UpdateSponsorship does. Withdrawal is final: a withdrawn sponsorship is answered
  // `failed_precondition` with PROBLEM_TYPE_FAILED_PRECONDITION.
  rpc WithdrawSponsorship(AdminServiceWithdrawSponsorshipRequest) returns (AdminServiceWithdrawSponsorshipResponse);

  // Lists every save of a sponsorship with what it changed.
  rpc ListSponsorshipEditingHistory(AdminServiceListSponsorshipEditingHistoryRequest) returns (AdminServiceListSponsorshipEditingHistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the staff notes on a sponsorship.
  rpc ListSponsorshipStaffNotes(AdminServiceListSponsorshipStaffNotesRequest) returns (AdminServiceListSponsorshipStaffNotesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Writes a staff note on a sponsorship.
  rpc CreateSponsorshipStaffNote(AdminServiceCreateSponsorshipStaffNoteRequest) returns (AdminServiceCreateSponsorshipStaffNoteResponse);

  // Replaces the body and pinning of a staff note, whoever wrote it.
  rpc UpdateSponsorshipStaffNote(AdminServiceUpdateSponsorshipStaffNoteRequest) returns (AdminServiceUpdateSponsorshipStaffNoteResponse);

  // Deletes a staff note, whoever wrote it.
  rpc DeleteSponsorshipStaffNote(AdminServiceDeleteSponsorshipStaffNoteRequest) returns (AdminServiceDeleteSponsorshipStaffNoteResponse);

  // Issues a one-minute sign-in for the sponsorship's contact, to see the sponsor pages as they
  // do. Development only: elsewhere it is answered `not_found`, and GetSponsorship's
  // impersonation_enabled is false.
  rpc ImpersonateSponsorship(AdminServiceImpersonateSponsorshipRequest) returns (AdminServiceImpersonateSponsorshipResponse);

  // Organizations

  // Lists every organization with how many sponsorships it has. Restricted staff are answered
  // `permission_denied`, as an organization spans conferences.
  rpc ListOrganizations(AdminServiceListOrganizationsRequest) returns (AdminServiceListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one organization by its domain, with its affiliation URLs and its sponsorships across
  // conferences. Restricted staff are answered `permission_denied`.
  rpc GetOrganization(AdminServiceGetOrganizationRequest) returns (AdminServiceGetOrganizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates an organization. A domain another organization has is answered with
  // PROBLEM_TYPE_INVALID_RECORD. Restricted staff are answered `permission_denied`.
  rpc CreateOrganization(AdminServiceCreateOrganizationRequest) returns (AdminServiceCreateOrganizationResponse);

  // Replaces every writable field of an organization, its domain included. A domain another
  // organization has is answered with PROBLEM_TYPE_INVALID_RECORD. Restricted staff are answered
  // `permission_denied`.
  rpc UpdateOrganization(AdminServiceUpdateOrganizationRequest) returns (AdminServiceUpdateOrganizationResponse);

  // Booth assignments

  // Returns which sponsorships of a conference hold a booth and which could.
  rpc GetBoothAssignment(AdminServiceGetBoothAssignmentRequest) returns (AdminServiceGetBoothAssignmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Assigns booths to exactly the sponsorships listed, taking them back from every other
  // sponsorship of the conference, all or nothing. Each sponsorship it changes records the
  // signed-in staff member in its editing history and publishes the change as UpdateSponsorship
  // does. A sponsorship ID the conference does not have is answered `not_found`. A booth for a
  // sponsorship that has withdrawn or awaits acceptance, and holds none yet, is answered
  // `failed_precondition`. Neither answer changes anything.
  rpc UpdateBoothAssignment(AdminServiceUpdateBoothAssignmentRequest) returns (AdminServiceUpdateBoothAssignmentResponse);

  // Sponsor events

  // Lists every event the sponsors of a conference submitted, pending ones first.
  rpc ListSponsorEvents(AdminServiceListSponsorEventsRequest) returns (AdminServiceListSponsorEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one event of a conference. An event of another conference is answered `not_found`.
  rpc GetSponsorEvent(AdminServiceGetSponsorEventRequest) returns (AdminServiceGetSponsorEventResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Replaces every changeable field of an event, recording the signed-in staff member in its
  // editing history, then publishes the change: a chat notification and, when the event is
  // accepted or its status changes, the conference website's event list. Accepting an event that
  // has a hero image also proposes the image to the website. A record failing validation, such as
  // a slug another event of the conference has or a co-host that is no sponsorship of the
  // conference, is answered `invalid_argument` with PROBLEM_TYPE_INVALID_RECORD. An event of
  // another conference is answered `not_found`.
  rpc UpdateSponsorEvent(AdminServiceUpdateSponsorEventRequest) returns (AdminServiceUpdateSponsorEventResponse);

  // Announcements

  // Broadcasts

  // Expense reports

  // Viewer

  // Returns the signed-in staff member.
  rpc GetViewer(AdminServiceGetViewerRequest) returns (AdminServiceGetViewerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Ends the staff session. A sponsor session in the same browser stays signed in.
  rpc SignOut(AdminServiceSignOutRequest) returns (AdminServiceSignOutResponse);
}
